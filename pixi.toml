[workspace]
name = "mbrpdoc-great"
version = "0.1.0"
description = "GREAT — Balmorel-based energy system analysis of future flexibility requirements."
authors = ["Mathias Berg Rosendal <mberos@dtu.dk>, Claude Opus 4.7 <claude@anthropic.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# All dependencies in one flat environment (pixi simplifies dependency management).
#
# NOTE: LaTeX (latexmk + TeX Live) is intentionally NOT included here. A full
# TeX Live install is too heavy for a project-local pixi env. Install it system-wide
# instead (e.g. via your distro's package manager or https://tug.org/texlive/).
# CI installs TeX Live separately in .github/workflows/reproduction.yaml.
[dependencies]
python = "3.12.*"
snakemake = ">=9.8"
click = "*"
# Analysis tools
numpy = "2.3.*"
pandas = "2.3.*"
matplotlib = "3.10.*"
seaborn = "0.13.*"
ipdb = "0.13.*"
# Testing
pytest = "8.4.*"
pytest-html = "4.1.*"
# General Python utilities
pip = "25.1.*"
# DAG visualization
graphviz = "*"
# Linting & CI
ruff = "*"
yamllint = "*"
shellcheck = "*"
pyxlsb = ">=1.0.10,<2"
cmcrameri = ">=1.9,<2"
openpyxl = ">=3.1.5,<4"
premailer = ">=3.10.0,<4"
xlsxwriter = "*"

[activation.env]
GAMS_SYSTEM_DIR = "/opt/gams/53"
LOCAL_BALMOREL_DIR = "scripts/Balmorel"

# --- Tasks ---
[tasks]
run = "snakemake --cores 4"
test = "snakemake test --cores 4"
postprocess = "snakemake --snakefile rules/postprocess.smk --cores 4"
weatheryear = "snakemake --snakefile rules/weatheryear.smk --cores 4"
dag = "snakemake dag --cores 1"
clean = "snakemake clean"
"clean-all" = "snakemake clean && rm -rf build/"
analyse = "cd scripts/Balmorel && python analysis/analyse.py "
verify =  "cd scripts/Balmorel && python analysis/verify.py "
illustrate-flex = "python scripts/postprocessing/illustrate_flexibility_needs.py "
sync-down = { cmd = "rsync -avzu --filter=':- .gitignore' mberos@sophia.dtu.dk:/home/mberos/Repos/mbrpdoc-great/ . && rsync -avzu --filter=':- .gitignore'  mberos@sophia.dtu.dk:/home/mberos/Repos/mbrpdoc-great/scripts/Balmorel/base/data/ ./scripts/Balmorel/base/data", description = "Syncs repository to local, including .git folder, but without gitignored files" }
sync-up = { cmd = "rsync -avzu --filter=':- .gitignore'  ./ mberos@sophia.dtu.dk:/home/mberos/Repos/mbrpdoc-great && rsync -avzu --filter=':- .gitignore'  ./scripts/Balmorel/base/data/ mberos@sophia.dtu.dk:/home/mberos/Repos/mbrpdoc-great/scripts/Balmorel/base/data", description = "Syncs repository to remote, including .git folder, but without gitignored files" }
sophia-sync-down = { cmd = "rsync -avzu --filter=':- .gitignore' mberos@sophia.dtu.dk:~/Repos/GREAT/ scripts/Balmorel && rsync -avzu --filter=':- .gitignore' mberos@sophia.dtu.dk:~/Repos/GREAT/base/data/ ./scripts/Balmorel/base/data", description = "Syncs repository to local, including .git folder, but without gitignored files" }
sophia-sync-up = { cmd = "rsync -avzu --filter=':- .gitignore'  scripts/Balmorel/ mberos@sophia.dtu.dk:~/Repos/GREAT && rsync -avzu --filter=':- .gitignore'  ./scripts/Balmorel/base/data/ mberos@sophia.dtu.dk:~/Repos/GREAT/base/data", description = "Syncs repository to remote, including .git folder, but without gitignored files" }
sync-plots = { cmd = "rsync -avzu mberos@login2.hpc.dtu.dk:'/work3/mberos/Balmorel/analysis/plots/*' scripts/Balmorel/analysis/plots/", description = "Download everything from analysis/plots"}
sync-output = { cmd = "rsync -avzu mberos@login2.hpc.dtu.dk:'/work3/mberos/Balmorel/analysis/output/*' scripts/Balmorel/analysis/output/", description = "Download everything from analysis/output"}

[tasks.sync-mainresults]
args = ["scenario", {arg="suffix", default="*"}]
cmd = "rsync -avzu mberos@login2.hpc.dtu.dk:'/work3/mberos/GREAT/scripts/Balmorel/{{ scenario }}/model/MainResults{{ suffix }}.gdx' scripts/Balmorel/{{ scenario }}/model/"
description = "Get MainResults from a scenario folder (first arg) with a certain suffix (second arg, defaults to *)"

[tasks.sync-mainresults-up]
args = ["scenario", {arg="suffix", default="*"}]
cmd = "rsync -avzu scripts/Balmorel/{{ scenario }}/model/MainResults{{ suffix }}.gdx mberos@login2.hpc.dtu.dk:'/work3/mberos/GREAT/scripts/Balmorel/{{ scenario }}/model/' "
description = "Get MainResults from a scenario folder (first arg) with a certain suffix (second arg, defaults to *)"

[tasks.sophia-sync-mainresults-up]
args = ["scenario", {arg="suffix", default="*"}]
cmd = "rsync -avzu scripts/Balmorel/{{ scenario }}/model/MainResults{{ suffix }}.gdx mberos@sophia.dtu.dk:'~/Repos/GREAT/{{ scenario }}/model/' "
description = "Get MainResults from a scenario folder (first arg) with a certain suffix (second arg, defaults to *)"

[tasks.sophia-sync-mainresults]
args = ["scenario", {arg="suffix", default="*"}]
cmd = "rsync -avzu 'mberos@sophia.dtu.dk:/home/mberos/Repos/GREAT/{{ scenario }}/model/MainResults{{ suffix }}.gdx' scripts/Balmorel/{{ scenario }}/model/"
description = "Get MainResults from a scenario folder (first arg) with a certain suffix (second arg, defaults to *)"

[tasks.create-weather-year-scenarios]
args = ["scenario"]
cmd = "python scripts/preprocessing/create_weather_year_scenarios.py --scenario {{ scenario }}"
description = "Scaffold <scenario>_WY<year>/ folders (1982-2020) for weather year runs off <scenario>'s simex_INV (see docs/adr/0013/0014)"

[tasks.sophia-sync-weather-years]
args = ["scenario"]
cmd = "rsync -avzu scripts/Balmorel/{{ scenario }}_WY* mberos@sophia.dtu.dk:~/Repos/GREAT/"
description = "Push <scenario>_WY<year>/ folders (run create-weather-year-scenarios first) to sophia.dtu.dk for submission"

[pypi-dependencies]
pybalmorel = ">=1.2.1, <2"
python-decouple = ">=3.8, <4"
